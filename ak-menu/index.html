<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>AK Menu Request · Akara Hospitality</title>
<link rel="icon" href="akara-white.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #000; color: #f2f2f0;
    font-family: "Sarabun", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.08), transparent 55%); pointer-events: none; }
  .box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  img { width: 120px; height: auto; clip-path: inset(100% 0 0 0); animation: write 1.4s cubic-bezier(.5,0,.2,1) .2s forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  .name { font-size: 13px; letter-spacing: .55em; padding-left: .55em; color: rgba(255,255,255,.75); }
  .msg { font-size: 15px; color: rgba(255,255,255,.7); min-height: 1.5em; }
  .msg i { font-style: normal; animation: blink 1.2s infinite; } .msg i:nth-child(2) { animation-delay: .2s; } .msg i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  a.btn { display: none; margin-top: 6px; padding: 12px 26px; border-radius: 8px; background: #fff; color: #000; font-weight: 700; text-decoration: none; }
  .err a.btn { display: inline-block; }
  .err .msg i { display: none; }
  @media (prefers-reduced-motion: reduce) { img { animation: none; clip-path: none; } }
</style>
</head>
<body>
<div class="box">
  <img src="akara-white.png" alt="AKARA">
  <div class="name">MENU REQUEST</div>
  <div class="msg" id="msg">กำลังเข้าสู่ระบบ / Opening<i>.</i><i>.</i><i>.</i></div>
  <a class="btn" id="btn" href="#">เข้าสู่ระบบ · Open</a>
</div>
<script>
// ประตูหน้า: อ่านลิงก์ปัจจุบันของระบบจาก url.json (อัปเดตอัตโนมัติจากเครื่องเซิร์ฟเวอร์) แล้วพาไป
// ?go=/requests/12 → เปิดหน้านั้นในระบบ (ใช้กับลิงก์ในอีเมล)
(async function () {
  var go = new URLSearchParams(location.search).get('go') || '/';
  if (!/^\/(?!\/)[\w\-\/?=&.%]*$/.test(go)) go = '/';
  var msg = document.getElementById('msg'), btn = document.getElementById('btn');
  try {
    var r = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
    var j = await r.json();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.url)) throw new Error('bad url');
    var target = j.url + go;
    btn.href = target;
    location.replace(target);
    setTimeout(function () { document.body.classList.add('err'); msg.textContent = 'ถ้าหน้าไม่เปลี่ยน กดปุ่มด้านล่าง / If nothing happens, tap below'; }, 4000);
  } catch (e) {
    document.body.classList.add('err');
    msg.textContent = 'ระบบกำลังปรับปรุง ลองใหม่อีกครั้งในไม่กี่นาที / The system is updating — please try again shortly';
    btn.href = location.href; btn.textContent = 'ลองใหม่ · Retry';
  }
})();
</script>
</body>
</html>
